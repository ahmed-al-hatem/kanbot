name: client

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --run
      - run: npm run build

  # Plan §6 phase 9 / SESSION-RUNBOOK §هـ. playwright.config.ts starts the API (mock AI, rate
  # limits off, its own data file) and `npm run build && npm run preview`; every test registers
  # its own user, so no seed is needed.
  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: cp .env.example .env
        working-directory: server
      - run: npm ci
        working-directory: client
      - run: npx playwright install --with-deps chromium
        working-directory: client
      # English and Arabic projects (playwright.config.ts); the preview build has Arabic on, as
      # in production (the config passes it to the build too).
      - run: npm run e2e
        working-directory: client
        env:
          VITE_FEATURE_AR: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: client/playwright-report
          retention-days: 14
